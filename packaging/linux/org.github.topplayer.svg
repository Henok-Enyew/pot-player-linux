<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="240">
      <stop offset="0" stop-color="#1e2129"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="cyan" gradientUnits="userSpaceOnUse" x1="84" y1="64" x2="196" y2="192">
      <stop offset="0" stop-color="#33dcff"/>
      <stop offset="1" stop-color="#0090c0"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="124" cy="128" r="96">
      <stop offset="0" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Obsidian tile -->
  <rect x="16.5" y="16.5" width="223" height="223" rx="47.5" fill="url(#bg)" stroke="#2a2d35"/>
  <!-- Neon glow -->
  <circle cx="124" cy="128" r="96" fill="url(#glow)"/>
  <!-- Play triangle -->
  <path d="M84 64 L196 128 L84 192 Z" fill="url(#cyan)" stroke="url(#cyan)" stroke-width="16" stroke-linejoin="round"/>
  <!-- Geometric "T" cut out of the triangle -->
  <g fill="url(#bg)">
    <rect x="93" y="100" width="60" height="18" rx="3"/>
    <rect x="114" y="108" width="18" height="56" rx="3"/>
  </g>
</svg>
